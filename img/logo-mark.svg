<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nora-AI Capital">
  <defs>
    <linearGradient id="nc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#1FC79B"/>
    </linearGradient>
  </defs>
  <!-- 圓角方塊徽章（squircle）：自帶底色，淺色/深色背景皆清晰 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#nc-grad)"/>
  <!-- N 字母標記：白色主筆畫 + 淡色對角線（暗示 AI / 數據流） -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M17 47 V17" stroke="#FFFFFF"/>
    <path d="M17 17 L47 47" stroke="#DCE6FF" stroke-width="6"/>
    <path d="M47 47 V17" stroke="#FFFFFF"/>
  </g>
</svg>
